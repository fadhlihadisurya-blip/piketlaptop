<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Laptop Lid / Bezel -->
  <rect x="116" y="136" width="280" height="190" rx="22" fill="#0f172a" />
  <!-- Laptop Screen -->
  <rect x="134" y="154" width="244" height="154" rx="10" fill="url(#screenGrad)" />
  <!-- Camera dot -->
  <circle cx="256" cy="145" r="3.5" fill="#475569" />
  <!-- QR emblem inside laptop screen -->
  <rect x="216" y="191" width="80" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
  <rect x="228" y="203" width="20" height="20" rx="3" fill="#ea580c" />
  <rect x="234" y="209" width="8" height="8" rx="1" fill="#ffffff" />
  <rect x="264" y="203" width="20" height="20" rx="3" fill="#0f172a" />
  <rect x="270" y="209" width="8" height="8" rx="1" fill="#ffffff" />
  <rect x="228" y="239" width="20" height="20" rx="3" fill="#0f172a" />
  <rect x="234" y="245" width="8" height="8" rx="1" fill="#ffffff" />
  <rect x="264" y="239" width="8" height="8" rx="1.5" fill="#ea580c" />
  <rect x="276" y="239" width="8" height="8" rx="1.5" fill="#0f172a" />
  <rect x="264" y="251" width="20" height="8" rx="1.5" fill="#ea580c" />
  <!-- Laptop Base -->
  <path d="M84 334 h344 a10 10 0 0 1 10 10 v8 a20 20 0 0 1 -20 20 H94 a20 20 0 0 1 -20 -20 v-8 a10 10 0 0 1 10 -10 z" fill="#ffffff" />
